---
- name: setup osx
  hosts: local
  connection: local
  vars_prompt:
    - name: sudo_password
      prompt: "Enter sudo password (for cask packages)"
      private: true
  roles:
    - { role: homebrew, tags: [ homebrew ] }
    - { role: mise, tags: [ mise ] }
    - { role: fish, tags: [ fish ] }
    - { role: git, tags: [ git ] }
    - { role: mac, tags: [ mac ] }
    - { role: pnpm, tags: [ pnpm ] }
    - { role: python, tags: [ python ] }
    - { role: vscode, tags: [ vscode ] }
