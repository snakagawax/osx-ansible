---
- name: Setup pnpm global bin directory
  command: pnpm setup
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.HOME }}/.local/bin:/opt/homebrew/bin:{{ ansible_env.PATH }}"
    PNPM_HOME: "{{ ansible_env.HOME }}/.local/share/pnpm"
  changed_when: false

- name: Install pnpm global packages
  command: "pnpm install -g {{ item.name }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/share/pnpm:{{ ansible_env.HOME }}/.local/share/mise/shims:{{ ansible_env.HOME }}/.local/bin:/opt/homebrew/bin:{{ ansible_env.PATH }}"
    PNPM_HOME: "{{ ansible_env.HOME }}/.local/share/pnpm"
  with_items: "{{ pnpm_global_packages }}"
