---
# Dotfiles management configuration
# Note: dotfiles_dir will be set dynamically from ghq list --full-path

# Symbolic link mappings
dotfiles_links:
  - src: ".gitconfig"
    dest: "{{ ansible_env.HOME }}/.gitconfig"
    
  - src: ".gitignore_global"
    dest: "{{ ansible_env.HOME }}/.gitignore_global"
    
  - src: ".inputrc"
    dest: "{{ ansible_env.HOME }}/.inputrc"
    
  - src: ".config/fish"
    dest: "{{ ansible_env.HOME }}/.config/fish"
    
  - src: ".config/karabiner"
    dest: "{{ ansible_env.HOME }}/.config/karabiner"

# Backup settings
backup_enabled: true
backup_suffix: ".ansible.backup"