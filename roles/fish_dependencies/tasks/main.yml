---
- name: Install Fish shell dependencies via Homebrew
  homebrew:
    name: "{{ fish_homebrew_packages }}"
    state: present
  tags:
    - fish_dependencies
    - homebrew

- name: Ensure pip and packaging are available
  command: python3 -m pip install --upgrade pip packaging
  register: pip_upgrade
  changed_when: "'Successfully installed' in pip_upgrade.stdout"
  failed_when: false
  tags:
    - fish_dependencies
    - python

- name: Install Fish-related Python packages
  pip:
    name: "{{ fish_pip_packages }}"
    state: present
    executable: pip3
  when: fish_pip_packages | length > 0
  failed_when: false
  register: pip_result
  tags:
    - fish_dependencies
    - python

- name: Show Python packages installation result
  debug:
    msg: "Python packages installation: {{ 'Success' if pip_result.rc == 0 else 'Skipped or failed (optional)' }}"
  when: pip_result is defined

- name: Set Fish as default shell
  user:
    name: "{{ ansible_user_id }}"
    shell: /opt/homebrew/bin/fish
  become: true
  tags:
    - fish_dependencies
    - shell
    - sudo_required

- name: Verify Fish installation
  command: /opt/homebrew/bin/fish --version
  register: fish_version
  changed_when: false

- name: Display Fish version
  debug:
    msg: "Fish shell version: {{ fish_version.stdout }}"